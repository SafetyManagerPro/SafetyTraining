name: SafetyTraining checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  syntax:
    # Salta le PR in bozza: i controlli partono solo quando la PR e' segnata come pronta.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run syntax checks
        run: npm run check
      - name: Verify SafetyManager JSON and CSV import fixtures
        run: node --test tests/integration-import-safetymanager-v48-4.test.mjs
      - name: Verify recorded Supabase migration history (read-only)
        run: |
          node --check scripts/audit-supabase-migrations.mjs
          node scripts/audit-supabase-migrations.mjs --strict
          node --test tests/migration-version-history-v47.test.mjs
          node --test tests/migration-source-lock-v47.test.mjs
