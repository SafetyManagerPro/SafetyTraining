name: SafetyTraining checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run syntax checks
        run: npm run check
      - name: Audit Supabase migration history (read-only report)
        run: node scripts/audit-supabase-migrations.mjs
