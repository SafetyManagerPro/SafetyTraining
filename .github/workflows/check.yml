name: SafetyTraining checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run syntax checks
        run: npm run check
      - name: Verify recorded Supabase migration history (read-only)
        run: |
          node --check scripts/audit-supabase-migrations.mjs
          node scripts/audit-supabase-migrations.mjs --strict
          node --test tests/migration-version-history-v47.test.mjs
          node --test tests/migration-source-lock-v47.test.mjs
