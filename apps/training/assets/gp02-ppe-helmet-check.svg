<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Casco: controllo visivo</title><desc id="desc">Un DPI efficace deve essere integro e adatto</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f7fafd" stroke="none"/><rect x="27" y="27" width="1146" height="646" rx="27" fill="white" stroke="#d5e6ef"/><rect x="27" y="27" width="1146" height="101" rx="27" fill="#153e59" stroke="none"/><text x="58" y="66" fill="#b9e0f0" font-size="16" font-weight="700" font-family="Arial,Helvetica,sans-serif">SICUREZZA GENERALE</text><text x="58" y="108" fill="white" font-size="34" font-weight="700" font-family="Arial,Helvetica,sans-serif">Casco: controllo visivo</text><text x="60" y="165" fill="#506b80" font-size="19" font-weight="500" font-family="Arial,Helvetica,sans-serif">Un DPI efficace deve essere integro e adatto</text><rect x="57" y="187" width="618" height="388" rx="21" fill="#eff7fa" stroke="#d0e5ec"/><path d="M204 373Q208 241 355 234Q488 240 500 375" stroke="#17688e" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="#ffda6e"/><path d="M176 373h347" stroke="#8c6c24" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="486" cy="253" r="22" fill="#24875c" stroke="none" stroke-width="3"/><path d="M475 253l9 9 17 -21" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="195" y="484" fill="#226f54" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif">INTEGRO</text><rect x="713" y="186" width="421" height="390" rx="6" fill="#fff" stroke="none"/><rect x="715" y="193" width="409" height="119" rx="14" fill="#fff1e9" stroke="none"/><rect x="715" y="193" width="8" height="119" rx="2" fill="#b8543b" stroke="none"/><text x="744" y="228" fill="#b8543b" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif">Prima dell'uso</text><text x="744" y="269" fill="#17384c" font-size="18" font-weight="500" font-family="Arial,Helvetica,sans-serif">Verifica integrità e regolazione</text><rect x="715" y="326" width="409" height="119" rx="14" fill="#eaf5ff" stroke="none"/><rect x="715" y="326" width="8" height="119" rx="2" fill="#266e97" stroke="none"/><text x="744" y="361" fill="#266e97" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif">Se danneggiato: segnala</text><text x="744" y="402" fill="#17384c" font-size="18" font-weight="500" font-family="Arial,Helvetica,sans-serif">Controlla il contesto operativo</text><rect x="715" y="459" width="409" height="119" rx="14" fill="#e9f7f0" stroke="none"/><rect x="715" y="459" width="8" height="119" rx="2" fill="#247d58" stroke="none"/><text x="744" y="494" fill="#247d58" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif">AZIONE PREVENTIVA</text><text x="744" y="535" fill="#17384c" font-size="18" font-weight="500" font-family="Arial,Helvetica,sans-serif">Scarta DPI con danni o difetti</text><text x="60" y="628" fill="#607e92" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif">ILLUSTRAZIONE DIDATTICA ORIGINALE · NON IN SCALA</text><text x="60" y="655" fill="#6d889b" font-size="16" font-weight="500" font-family="Arial,Helvetica,sans-serif">Verifica sempre manuale, DVR e procedure applicabili.</text></svg>