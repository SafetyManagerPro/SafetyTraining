<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="#0f1828"/><rect x="30" y="30" width="1140" height="460" rx="28" fill="#142239" stroke="#28405f" stroke-width="2"/><rect x="70" y="95" width="430" height="300" rx="20" fill="#0c1523" stroke="#6aa8ff" stroke-width="3"/><circle cx="285" cy="245" r="70" fill="#6aa8ff" opacity=".9"/><polygon points="265,205 265,285 330,245" fill="#0f1828"/><text x="560" y="130" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">Napo in… Rischio incendio</text><text x="560" y="185" fill="#ffd166" font-family="Arial" font-size="24" font-weight="700">Scena: Lasciare libero il passaggio</text><text x="560" y="245" fill="#a8b3c7" font-family="Arial" font-size="20">Obiettivo didattico</text><foreignObject x="560" y="265" width="540" height="130"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#f4f7fb;font-size:22px;line-height:1.35">Collegare ordine, esodo, accessibilità e comportamento durante l’emergenza.</div></foreignObject><text x="70" y="445" fill="#4dd3a8" font-family="Arial" font-size="18">Prima del video: fai una domanda. Dopo il video: chiedi quale barriera di sicurezza mancava o ha funzionato.</text></svg>