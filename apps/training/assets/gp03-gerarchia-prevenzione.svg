<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Gerarchia della prevenzione</title><desc id="desc">Cinque livelli di intervento: eliminazione del pericolo, sostituzione, misure tecniche e collettive, organizzative, DPI. La priorità è intervenire alla fonte.</desc><rect width="1200" height="700" fill="#f5f8fb"/><rect width="1200" height="9" fill="#177fac"/><rect x="48" y="53" width="1104" height="95" rx="20" fill="#ffffff" stroke="none" stroke-width="3"/><text x="78" y="92" font-size="18" fill="#31718f" font-weight="700" font-family="Arial,Helvetica,sans-serif">SAFETYTRAINING · GUIDA VISIVA</text><text x="78" y="130" font-size="31" fill="#17334a" font-weight="700" font-family="Arial,Helvetica,sans-serif">Gerarchia della prevenzione</text><rect x="51" y="162" width="670" height="433" rx="22" fill="#ffffff" stroke="none" stroke-width="3"/><rect x="90" y="186" width="530" height="58" rx="12" fill="#147d64" stroke="none" stroke-width="3"/><text x="113" y="225" font-size="25" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">ELIMINA</text><rect x="126" y="259" width="455" height="58" rx="12" fill="#209d83" stroke="none" stroke-width="3"/><text x="149" y="298" font-size="25" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">SOSTITUISCI</text><rect x="162" y="332" width="380" height="58" rx="12" fill="#2e83c5" stroke="none" stroke-width="3"/><text x="185" y="371" font-size="25" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">DPC / RIPARI</text><rect x="198" y="405" width="305" height="58" rx="12" fill="#e6a447" stroke="none" stroke-width="3"/><text x="221" y="444" font-size="25" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">ORGANIZZA</text><rect x="234" y="478" width="230" height="58" rx="12" fill="#d76a53" stroke="none" stroke-width="3"/><text x="257" y="517" font-size="25" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">DPI</text><text x="84" y="154" font-size="21" fill="#147d64" font-weight="700" font-family="Arial,Helvetica,sans-serif">PIÙ EFFICACE</text><text x="84" y="591" font-size="20" fill="#af4335" font-weight="700" font-family="Arial,Helvetica,sans-serif">RISCHIO RESIDUO</text><rect x="751" y="162" width="400" height="433" rx="22" fill="#e7f0f7" stroke="none" stroke-width="3"/><text x="778" y="202" font-size="25" fill="#185574" font-weight="700" font-family="Arial,Helvetica,sans-serif">COSA FARE</text><rect x="774" y="224" width="348" height="91" rx="13" fill="#ffffff" stroke="none" stroke-width="3"/><circle cx="801" cy="251" r="13" fill="#15876f" stroke="none" stroke-width="0"/><text x="825" y="250" font-size="16" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">01</text><text x="829" y="278" font-size="19" fill="#1d405a" font-weight="700" font-family="Arial,Helvetica,sans-serif">Elimina o sostituisci il pericolo</text><rect x="774" y="339" width="348" height="91" rx="13" fill="#ffffff" stroke="none" stroke-width="3"/><circle cx="801" cy="366" r="13" fill="#1675a3" stroke="none" stroke-width="0"/><text x="825" y="365" font-size="16" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">02</text><text x="829" y="393" font-size="19" fill="#1d405a" font-weight="700" font-family="Arial,Helvetica,sans-serif">Prediligi ripari e misure collettive</text><rect x="774" y="454" width="348" height="91" rx="13" fill="#ffffff" stroke="none" stroke-width="3"/><circle cx="801" cy="481" r="13" fill="#c67a2c" stroke="none" stroke-width="0"/><text x="825" y="480" font-size="16" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">03</text><text x="829" y="508" font-size="19" fill="#1d405a" font-weight="700" font-family="Arial,Helvetica,sans-serif">Procedure e DPI coprono rischi residui</text><rect x="50" y="622" width="1100" height="52" rx="12" fill="#15374f" stroke="none" stroke-width="3"/><text x="74" y="654" font-size="16" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">ILLUSTRAZIONE DIDATTICA ORIGINALE · NON SOSTITUISCE PROCEDURE, DVR O MANUALI</text></svg>