<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="#0f1828"/><rect x="28" y="28" width="1144" height="464" rx="24" fill="#142239" stroke="#28405f" stroke-width="2"/><text x="60" y="88" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">Sicurezza su strada</text><text x="60" y="122" fill="#a8b3c7" font-family="Arial" font-size="20">Scenario protetto: mezzo, segnalazione, operatore, via di fuga</text><rect x="70" y="190" width="220" height="120" rx="18" fill="#0c1523" stroke="#6aa8ff" stroke-width="3"/><circle cx="102" cy="222" r="18" fill="#6aa8ff"/><text x="102" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">1</text><text x="180" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Segnalazione</text><line x1="290" y1="250" x2="320" y2="250" stroke="#6b7b97" stroke-width="4"/><polygon points="320,250 302,240 302,260" fill="#6b7b97"/><rect x="340" y="190" width="220" height="120" rx="18" fill="#0c1523" stroke="#ffd166" stroke-width="3"/><circle cx="372" cy="222" r="18" fill="#ffd166"/><text x="372" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">2</text><text x="450" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Mezzo in protezione</text><line x1="560" y1="250" x2="590" y2="250" stroke="#6b7b97" stroke-width="4"/><polygon points="590,250 572,240 572,260" fill="#6b7b97"/><rect x="610" y="190" width="220" height="120" rx="18" fill="#0c1523" stroke="#4dd3a8" stroke-width="3"/><circle cx="642" cy="222" r="18" fill="#4dd3a8"/><text x="642" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">3</text><text x="720" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Operatore visibile</text><line x1="830" y1="250" x2="860" y2="250" stroke="#6b7b97" stroke-width="4"/><polygon points="860,250 842,240 842,260" fill="#6b7b97"/><rect x="880" y="190" width="220" height="120" rx="18" fill="#0c1523" stroke="#ff7a7a" stroke-width="3"/><circle cx="912" cy="222" r="18" fill="#ff7a7a"/><text x="912" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">4</text><text x="990" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Via di fuga</text><text x="60" y="420" fill="#4dd3a8" font-family="Arial" font-size="18">Usa l’immagine per far verbalizzare all’aula il concetto chiave prima di passare alla spiegazione.</text></svg>