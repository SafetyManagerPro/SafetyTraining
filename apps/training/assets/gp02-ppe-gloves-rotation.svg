<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Guanti e organi rotanti</title><desc id="desc">Non tutti i DPI sono appropriati con ogni macchina</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f7fafd" stroke="none"/><rect x="27" y="27" width="1146" height="646" rx="27" fill="white" stroke="#d5e6ef"/><rect x="27" y="27" width="1146" height="101" rx="27" fill="#153e59" stroke="none"/><text x="58" y="66" fill="#b9e0f0" font-size="16" font-weight="700" font-family="Arial,Helvetica,sans-serif">SICUREZZA GENERALE</text><text x="58" y="108" fill="white" font-size="34" font-weight="700" font-family="Arial,Helvetica,sans-serif">Guanti e organi rotanti</text><text x="60" y="165" fill="#506b80" font-size="19" font-weight="500" font-family="Arial,Helvetica,sans-serif">Non tutti i DPI sono appropriati con ogni macchina</text><rect x="57" y="187" width="618" height="388" rx="21" fill="#eff7fa" stroke="#d0e5ec"/><rect x="215" y="246" width="298" height="198" rx="20" fill="#d7e8f4" stroke="#397a93"/><circle cx="351" cy="329" r="61" fill="#627e93" stroke="none" stroke-width="3"/><g><circle cx="483" cy="249" r="28" fill="#e15550" stroke="none" stroke-width="3"/><text x="473" y="258" fill="white" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif">!</text><text x="421" y="208" fill="#b43a34" font-size="16" font-weight="700" font-family="Arial,Helvetica,sans-serif">PUNTO PRESA</text></g><path d="M280 392h136" stroke="#d65e4a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="713" y="186" width="421" height="390" rx="6" fill="#fff" stroke="none"/><rect x="715" y="193" width="409" height="119" rx="14" fill="#fff1e9" stroke="none"/><rect x="715" y="193" width="8" height="119" rx="2" fill="#b8543b" stroke="none"/><text x="744" y="228" fill="#b8543b" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif">Pericolo</text><text x="744" y="269" fill="#17384c" font-size="18" font-weight="500" font-family="Arial,Helvetica,sans-serif">Trascinamento o impiglio</text><rect x="715" y="326" width="409" height="119" rx="14" fill="#eaf5ff" stroke="none"/><rect x="715" y="326" width="8" height="119" rx="2" fill="#266e97" stroke="none"/><text x="744" y="361" fill="#266e97" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif">Valuta procedura e protezioni</text><text x="744" y="402" fill="#17384c" font-size="18" font-weight="500" font-family="Arial,Helvetica,sans-serif">Controlla il contesto operativo</text><rect x="715" y="459" width="409" height="119" rx="14" fill="#e9f7f0" stroke="none"/><rect x="715" y="459" width="8" height="119" rx="2" fill="#247d58" stroke="none"/><text x="744" y="494" fill="#247d58" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif">AZIONE PREVENTIVA</text><text x="744" y="535" fill="#17384c" font-size="18" font-weight="500" font-family="Arial,Helvetica,sans-serif">Evita guanti a rischio impiglio</text><text x="60" y="628" fill="#607e92" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif">ILLUSTRAZIONE DIDATTICA ORIGINALE · NON IN SCALA</text><text x="60" y="655" fill="#6d889b" font-size="16" font-weight="500" font-family="Arial,Helvetica,sans-serif">Verifica sempre manuale, DVR e procedure applicabili.</text></svg>