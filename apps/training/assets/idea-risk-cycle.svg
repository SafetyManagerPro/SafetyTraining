<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="#0f1828"/><rect x="28" y="28" width="1144" height="464" rx="24" fill="#142239" stroke="#28405f" stroke-width="2"/><text x="60" y="88" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">Rischio: dal pericolo al danno</text><text x="60" y="122" fill="#a8b3c7" font-family="Arial" font-size="20">Pericolo → esposizione → evento → danno → misura di prevenzione</text><rect x="50" y="190" width="180" height="120" rx="18" fill="#0c1523" stroke="#6aa8ff" stroke-width="3"/><circle cx="82" cy="222" r="18" fill="#6aa8ff"/><text x="82" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">1</text><text x="140" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Pericolo</text><line x1="230" y1="250" x2="260" y2="250" stroke="#6b7b97" stroke-width="4"/><polygon points="260,250 242,240 242,260" fill="#6b7b97"/><rect x="270" y="190" width="180" height="120" rx="18" fill="#0c1523" stroke="#ffd166" stroke-width="3"/><circle cx="302" cy="222" r="18" fill="#ffd166"/><text x="302" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">2</text><text x="360" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Esposizione</text><line x1="450" y1="250" x2="480" y2="250" stroke="#6b7b97" stroke-width="4"/><polygon points="480,250 462,240 462,260" fill="#6b7b97"/><rect x="490" y="190" width="180" height="120" rx="18" fill="#0c1523" stroke="#ff7a7a" stroke-width="3"/><circle cx="522" cy="222" r="18" fill="#ff7a7a"/><text x="522" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">3</text><text x="580" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Evento</text><line x1="670" y1="250" x2="700" y2="250" stroke="#6b7b97" stroke-width="4"/><polygon points="700,250 682,240 682,260" fill="#6b7b97"/><rect x="710" y="190" width="180" height="120" rx="18" fill="#0c1523" stroke="#d57aff" stroke-width="3"/><circle cx="742" cy="222" r="18" fill="#d57aff"/><text x="742" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">4</text><text x="800" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Danno</text><line x1="890" y1="250" x2="920" y2="250" stroke="#6b7b97" stroke-width="4"/><polygon points="920,250 902,240 902,260" fill="#6b7b97"/><rect x="930" y="190" width="180" height="120" rx="18" fill="#0c1523" stroke="#4dd3a8" stroke-width="3"/><circle cx="962" cy="222" r="18" fill="#4dd3a8"/><text x="962" y="228" text-anchor="middle" fill="#0f1828" font-family="Arial" font-size="18" font-weight="700">5</text><text x="1020" y="250" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Prevenzione</text><text x="60" y="420" fill="#4dd3a8" font-family="Arial" font-size="18">Usa l’immagine per far verbalizzare all’aula il concetto chiave prima di passare alla spiegazione.</text></svg>