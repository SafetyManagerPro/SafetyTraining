<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0d1829"/><stop offset="1" stop-color="#14253e"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="92" font-family="Arial" font-size="48" font-weight="700" fill="#f4f7fb">Se qualcosa non va: STOP → SEGNALA → RIPRISTINA</text><text x="75" y="132" font-family="Arial" font-size="22" fill="#a8b3c7">La continuità del lavoro non viene prima della sicurezza.</text><circle cx="270" cy="365" r="135" fill="#351b2a" stroke="#ff7a7a" stroke-width="5"/><text x="270" y="350" text-anchor="middle" font-family="Arial" font-size="38" font-weight="800" fill="#ff9a9a">ANOMALIA?</text><text x="270" y="395" text-anchor="middle" font-family="Arial" font-size="22" fill="#e8dce1">pericolo, guasto, dubbio</text><text x="270" y="427" text-anchor="middle" font-family="Arial" font-size="22" fill="#e8dce1">o esposizione imprevista</text><rect x="500" y="245" width="280" height="230" rx="28" fill="#172943" stroke="#ffd166" stroke-width="4"/><text x="640" y="310" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#ffd166">1. STOP</text><text x="640" y="365" text-anchor="middle" font-family="Arial" font-size="22" fill="#d5deec">ferma se puoi farlo</text><text x="640" y="398" text-anchor="middle" font-family="Arial" font-size="22" fill="#d5deec">senza esporti</text><rect x="840" y="245" width="280" height="230" rx="28" fill="#172943" stroke="#6aa8ff" stroke-width="4"/><text x="980" y="310" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#89baff">2. SEGNALA</text><text x="980" y="365" text-anchor="middle" font-family="Arial" font-size="22" fill="#d5deec">avvisa il soggetto</text><text x="980" y="398" text-anchor="middle" font-family="Arial" font-size="22" fill="#d5deec">competente</text><rect x="1180" y="245" width="300" height="230" rx="28" fill="#172943" stroke="#4dd3a8" stroke-width="4"/><text x="1330" y="310" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#4dd3a8">3. RIPRISTINA</text><text x="1330" y="365" text-anchor="middle" font-family="Arial" font-size="22" fill="#d5deec">riprendi solo quando</text><text x="1330" y="398" text-anchor="middle" font-family="Arial" font-size="22" fill="#d5deec">è tornato sicuro</text><g stroke="#7f93b1" stroke-width="8" fill="none"><line x1="407" y1="365" x2="490" y2="365"/><line x1="790" y1="365" x2="830" y2="365"/><line x1="1130" y1="365" x2="1170" y2="365"/></g><rect x="145" y="610" width="1310" height="160" rx="24" fill="#101a2c" stroke="#28405f" stroke-width="2"/><text x="185" y="665" font-family="Arial" font-size="27" font-weight="700" fill="#ffcf70">Quando non riprendere</text><text x="185" y="715" font-family="Arial" font-size="23" fill="#d5deec">Se restano dubbi su attrezzatura, ambiente, salute della persona o efficacia della misura, l’attività rimane sospesa finché il soggetto competente non conferma il ripristino.</text></svg>