<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="#0f1828"/><rect x="28" y="28" width="1144" height="464" rx="24" fill="#142239" stroke="#28405f" stroke-width="2"/><text x="60" y="86" fill="#f4f7fb" font-family="Arial" font-size="34" font-weight="700">Emergenza: sequenza corretta</text><text x="60" y="120" fill="#a8b3c7" font-family="Arial" font-size="20">Allarme → interruzione in sicurezza → esodo → raccolta → verifica</text><rect x="60" y="190" width="190" height="118" rx="18" fill="#0c1523" stroke="#6aa8ff" stroke-width="3"/><circle cx="94" cy="224" r="18" fill="#6aa8ff"/><text x="94" y="230" text-anchor="middle" fill="#101018" font-family="Arial" font-size="18" font-weight="700">1</text><text x="155.0" y="256" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Allarme</text><line x1="250" y1="249" x2="268" y2="249" stroke="#6b7b97" stroke-width="4"/><polygon points="268,249 256,240 256,258" fill="#6b7b97"/><rect x="280" y="190" width="190" height="118" rx="18" fill="#0c1523" stroke="#ffd166" stroke-width="3"/><circle cx="314" cy="224" r="18" fill="#ffd166"/><text x="314" y="230" text-anchor="middle" fill="#101018" font-family="Arial" font-size="18" font-weight="700">2</text><text x="375.0" y="256" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Interrompi se sicuro</text><line x1="470" y1="249" x2="488" y2="249" stroke="#6b7b97" stroke-width="4"/><polygon points="488,249 476,240 476,258" fill="#6b7b97"/><rect x="500" y="190" width="190" height="118" rx="18" fill="#0c1523" stroke="#4dd3a8" stroke-width="3"/><circle cx="534" cy="224" r="18" fill="#4dd3a8"/><text x="534" y="230" text-anchor="middle" fill="#101018" font-family="Arial" font-size="18" font-weight="700">3</text><text x="595.0" y="256" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Esci ordinatamente</text><line x1="690" y1="249" x2="708" y2="249" stroke="#6b7b97" stroke-width="4"/><polygon points="708,249 696,240 696,258" fill="#6b7b97"/><rect x="720" y="190" width="190" height="118" rx="18" fill="#0c1523" stroke="#ff7a7a" stroke-width="3"/><circle cx="754" cy="224" r="18" fill="#ff7a7a"/><text x="754" y="230" text-anchor="middle" fill="#101018" font-family="Arial" font-size="18" font-weight="700">4</text><text x="815.0" y="256" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Raggiungi il punto di raccolta</text><line x1="910" y1="249" x2="928" y2="249" stroke="#6b7b97" stroke-width="4"/><polygon points="928,249 916,240 916,258" fill="#6b7b97"/><rect x="940" y="190" width="190" height="118" rx="18" fill="#0c1523" stroke="#d57aff" stroke-width="3"/><circle cx="974" cy="224" r="18" fill="#d57aff"/><text x="974" y="230" text-anchor="middle" fill="#101018" font-family="Arial" font-size="18" font-weight="700">5</text><text x="1035.0" y="256" text-anchor="middle" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="700">Attendi istruzioni</text><text x="60" y="420" fill="#4dd3a8" font-family="Arial" font-size="18">Schema originale locale, utile per avviare la spiegazione e far parlare il gruppo.</text></svg>