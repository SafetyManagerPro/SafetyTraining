<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">DPC prima dei DPI</title><desc id="desc">La protezione collettiva ha priorità quando è tecnicamente applicabile</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f5f9fc" stroke="none"/><rect x="26" y="26" width="1148" height="648" rx="28" fill="#fff" stroke="#d9e7f0"/><rect x="26" y="26" width="1148" height="95" rx="28" fill="#143a59" stroke="none"/><text x="64" y="86" font-family="Arial,sans-serif" font-weight="800" font-size="37" text-anchor="start" fill="#fff">DPC prima dei DPI</text><text x="64" y="158" font-family="Arial,sans-serif" font-weight="600" font-size="22" text-anchor="start" fill="#45657d">La protezione collettiva ha priorità quando è tecnicamente applicabile</text><rect x="65" y="182" width="568" height="415" rx="24" fill="#edf7fd" stroke="#c7e1ee"/><g><path d="M294 166L432 210V320Q424 413 295 482Q159 416 158 320V210Z" fill="#d8f6e7" stroke="#24956a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M224 323L280 371L372 267" fill="none" stroke="#1e9468" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><text x="295" y="548" font-family="Arial,sans-serif" font-weight="600" font-size="19" text-anchor="middle" fill="#2d7469">Protezione collettiva → protezione individuale</text></g><text x="90" y="635" font-family="Arial,sans-serif" font-weight="700" font-size="17" text-anchor="start" fill="#668096">SAFETYTRAINING · ILLUSTRAZIONE DIDATTICA ORIGINALE</text><rect x="674" y="194" width="443" height="122" rx="18" fill="#e3eff8" stroke="none"/><text x="696" y="232" font-family="Arial,sans-serif" font-weight="800" font-size="20" text-anchor="start" fill="#27638a">PRIORITÀ</text><text x="696" y="273" font-family="Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" fill="#183750">Eliminare o ridurre il rischio</text><rect x="674" y="331" width="443" height="122" rx="18" fill="#e8f5ee" stroke="none"/><text x="696" y="369" font-family="Arial,sans-serif" font-weight="800" font-size="20" text-anchor="start" fill="#1b7b61">DPC</text><text x="696" y="410" font-family="Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" fill="#183750">Ripari, parapetti e segregazioni</text><rect x="674" y="468" width="443" height="122" rx="18" fill="#fff3df" stroke="none"/><text x="696" y="506" font-family="Arial,sans-serif" font-weight="800" font-size="20" text-anchor="start" fill="#91631c">DPI</text><text x="696" y="547" font-family="Arial,sans-serif" font-weight="600" font-size="21" text-anchor="start" fill="#183750">Per rischi residui e casi previsti</text></svg>