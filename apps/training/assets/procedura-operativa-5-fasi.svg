<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0d1829"/><stop offset="1" stop-color="#132844"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="75" y="92" font-family="Arial" font-size="48" font-weight="700" fill="#f4f7fb">Come procedere: 5 fasi operative</text>
<text x="75" y="132" font-family="Arial" font-size="22" fill="#a8b3c7">Una regola diventa utile quando si trasforma in una sequenza concreta.</text>
<g filter="url(#s)">
<rect x="70" y="245" width="270" height="255" rx="30" fill="#172943" stroke="#6aa8ff" stroke-width="4"/><circle cx="205" cy="305" r="35" fill="#6aa8ff"/><text x="205" y="316" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#08121f">1</text><text x="205" y="382" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#f4f7fb">PREPARA</text><text x="205" y="430" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">attività, persone, rischi</text><text x="205" y="460" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">e condizioni</text>
<rect x="370" y="245" width="270" height="255" rx="30" fill="#172943" stroke="#ffd166" stroke-width="4"/><circle cx="505" cy="305" r="35" fill="#ffd166"/><text x="505" y="316" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#08121f">2</text><text x="505" y="382" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#f4f7fb">CONTROLLA</text><text x="505" y="430" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">ambiente, mezzi, DPI</text><text x="505" y="460" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">e procedura</text>
<rect x="670" y="245" width="270" height="255" rx="30" fill="#172943" stroke="#4dd3a8" stroke-width="4"/><circle cx="805" cy="305" r="35" fill="#4dd3a8"/><text x="805" y="316" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#08121f">3</text><text x="805" y="382" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#f4f7fb">ESEGUI</text><text x="805" y="430" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">applica il metodo</text><text x="805" y="460" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">senza scorciatoie</text>
<rect x="970" y="245" width="270" height="255" rx="30" fill="#172943" stroke="#75e0ff" stroke-width="4"/><circle cx="1105" cy="305" r="35" fill="#75e0ff"/><text x="1105" y="316" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#08121f">4</text><text x="1105" y="382" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#f4f7fb">VERIFICA</text><text x="1105" y="430" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">controlla risultato</text><text x="1105" y="460" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">e rischi residui</text>
<rect x="1270" y="245" width="270" height="255" rx="30" fill="#172943" stroke="#d57aff" stroke-width="4"/><circle cx="1405" cy="305" r="35" fill="#d57aff"/><text x="1405" y="316" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#08121f">5</text><text x="1405" y="382" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#f4f7fb">SEGNALA</text><text x="1405" y="430" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">anomalie, near miss</text><text x="1405" y="460" text-anchor="middle" font-family="Arial" font-size="20" fill="#cbd6e8">e azioni correttive</text>
</g>
<g stroke="#7f93b1" stroke-width="7" fill="none" stroke-linecap="round"><line x1="342" y1="372" x2="365" y2="372"/><line x1="642" y1="372" x2="665" y2="372"/><line x1="942" y1="372" x2="965" y2="372"/><line x1="1242" y1="372" x2="1265" y2="372"/></g>
<rect x="105" y="620" width="1390" height="150" rx="24" fill="#101a2c" stroke="#28405f" stroke-width="2"/><text x="145" y="675" font-family="Arial" font-size="27" font-weight="700" fill="#4dd3a8">Tre domande da fare sempre</text><text x="145" y="720" font-family="Arial" font-size="23" fill="#d5deec">Prima: “le condizioni sono sicure?”. Durante: “sto seguendo il metodo?”. Dopo: “è rimasto qualcosa da correggere o segnalare?”.</text>
</svg>